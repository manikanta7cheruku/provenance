# The web container: static files, a fallback to index.html for the app's own routes, and a proxy
# for /api/. TLS and HSTS are handled at the edge (Caddy). Everything here is about what the browser
# is told about the pages themselves.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # What a page may load. Scripts and styles only from this origin (the build has no inline script),
    # styles may be inline because the app sets style attributes, images may be data or blob URLs
    # (pictures on a resume), and the page cannot be framed or post a form elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API address is looked up again every few seconds (Docker's own DNS), not once at start-up.
    # Without this a new API container, with a new address, would be unreachable until this container
    # restarted, and every deploy would break the site for a while.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;

    # The API. The headers it needs to see who is really asking are passed on.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz { proxy_pass $api_upstream; }

    # Built files have a hash in their name, so they never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the app. index.html itself is never cached, so a deploy reaches people at once.
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
