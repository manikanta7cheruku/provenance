name: provenance

x-api-build: &api-build
  context: .
  dockerfile: infra/docker/api.Dockerfile

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://provenance_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-provenance}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-provenance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-provenance}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SIGNUP_MODE: ${SIGNUP_MODE:-invite}
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
  # "-" (not ":-") means: use mailpit only when the variable is UNSET. An empty SMTP_HOST in
  # .env is respected and selects log mode (emails written to the worker log).
  SMTP_HOST: ${SMTP_HOST-mailpit}
  SMTP_PORT: ${SMTP_PORT-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS-false}
  MAIL_FROM: ${MAIL_FROM:-Provenance <no-reply@localhost>}
  DEV_INBOX_URL: ${DEV_INBOX_URL:-http://localhost:8025}
  # Private file storage (resumes). The api and the worker share this volume.
  FILE_STORAGE_DIR: ${FILE_STORAGE_DIR:-/data/files}

x-worker-env: &worker-env
  <<: *api-env
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
  TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-7}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
  LLM_EMBEDDING_DIMENSIONS: ${LLM_EMBEDDING_DIMENSIONS:-768}
  LLM_MIN_INTERVAL_SECONDS: ${LLM_MIN_INTERVAL_SECONDS:-0}
  LLM_INPUT_PRICE_PER_MILLION: ${LLM_INPUT_PRICE_PER_MILLION:-0}
  LLM_OUTPUT_PRICE_PER_MILLION: ${LLM_OUTPUT_PRICE_PER_MILLION:-0}
  LLM_EMBEDDING_PRICE_PER_MILLION: ${LLM_EMBEDDING_PRICE_PER_MILLION:-0}

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  migrate:
    build: *api-build
    image: provenance-api:dev
    command: ["alembic", "-c", "packages/persistence/alembic.ini", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: provenance-api:dev
    command:
      - uvicorn
      - pv_api.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/apps
      - --reload-dir=/app/packages
      # Development only: trust X-Forwarded-For from the web dev proxy so rate limits see real clients.
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      <<: *api-env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./packages:/app/packages:ro
      - files:/data/files
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Background worker: sends email and (from checkpoint 1.5) runs parsing and analysis.
  # Same image as the API. It has no reload: after editing worker code run
  #   .\scripts\pv.ps1 restart worker
  # Run more workers to go faster: docker compose up -d --scale worker=2
  worker:
    build: *api-build
    image: provenance-api:dev
    command: ["python", "-m", "pv_worker"]
    environment: *worker-env
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./apps/worker:/app/apps/worker:ro
      - ./packages:/app/packages:ro
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      # The worker touches a file every heartbeat. Healthy means "touched in the last minute".
      test:
        - CMD
        - python
        - -c
        - "import os,sys,tempfile,time; p=os.path.join(tempfile.gettempdir(),'pv_worker_alive'); sys.exit(0 if time.time()-os.path.getmtime(p)<60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # SIGTERM lets the worker finish the task in hand. Give it time before SIGKILL.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Local inbox for verification and reset emails. UI: http://localhost:8025, SMTP: mailpit:1025.
  # Verified against the official release list on 2026-10-22 (newer releases exist; see
  # docs/providers/mailpit.md before changing MAILPIT_TAG).
  mailpit:
    image: axllent/mailpit:${MAILPIT_TAG:-v1.30.5}
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  files:
  web_node_modules:
