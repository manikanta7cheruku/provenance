name: provenance

x-api-build: &api-build
  context: .
  dockerfile: infra/docker/api.Dockerfile

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://provenance_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-provenance}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-provenance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-provenance}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SIGNUP_MODE: ${SIGNUP_MODE:-invite}
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  MAIL_FROM: ${MAIL_FROM:-Provenance <no-reply@localhost>}

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  migrate:
    build: *api-build
    image: provenance-api:dev
    command: ["alembic", "-c", "packages/persistence/alembic.ini", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: provenance-api:dev
    command:
      - uvicorn
      - pv_api.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/apps
      - --reload-dir=/app/packages
      # Development only: trust X-Forwarded-For from the web dev proxy so rate limits see real clients.
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      <<: *api-env
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./packages:/app/packages:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Optional local inbox for verification and reset emails.
  # Start with: docker compose --profile mail up --build
  # Then set SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_STARTTLS=false in .env.
  # Check Docker Hub for a current tag and put it in MAILPIT_TAG.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:${MAILPIT_TAG:-v1.21.8}
    ports:
      - "127.0.0.1:8025:8025"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  web_node_modules:
