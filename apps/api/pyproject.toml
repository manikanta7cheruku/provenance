[project]
name = "pv-api"
version = "0.1.0"
description = "Provenance HTTP API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "argon2-cffi>=23.1,<26",
    "pv-config",
    "pv-domain",
    "pv-persistence",
]

[tool.uv.sources]
pv-config = { workspace = true }
pv-domain = { workspace = true }
pv-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_api"]
