[project]
name = "provenance-workspace"
version = "0.1.0"
description = "Provenance monorepo workspace root. Not published."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "types-defusedxml>=0.7,<1",
    # Test-only: open the reports we write with real readers. Never imported by the product.
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/integration", "tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs a migrated PostgreSQL (run with: pytest -m integration)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = [
    "pv_api",
    "pv_config",
    "pv_domain",
    "pv_files",
    "pv_github",
    "pv_llm",
    "pv_mail",
    "pv_persistence",
    "pv_worker",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
# User-facing sentences stay whole on one line so a person can search the code for the text on screen.
"packages/domain/src/pv_domain/eligibility.py" = ["E501"]
"packages/domain/src/pv_domain/github.py" = ["E501"]
