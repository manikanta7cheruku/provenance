[project]
name = "provenance-workspace"
version = "0.1.0"
description = "Provenance monorepo workspace root. Not published."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs a migrated PostgreSQL (run with: pytest -m integration)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
known-first-party = ["pv_api", "pv_config", "pv_domain", "pv_persistence"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "packages/config/src",
    "packages/domain/src",
    "packages/persistence/src",
]
packages = ["pv_api", "pv_config", "pv_domain", "pv_persistence"]
