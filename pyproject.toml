[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/config/src",
    "packages/domain/src",
    "packages/files/src",
    "packages/github/src",
    "packages/llm/src",
    "packages/mail/src",
    "packages/persistence/src",
]
packages = [
    "pv_api",
    "pv_config",
    "pv_domain",
    "pv_files",
    "pv_github",
    "pv_llm",
    "pv_mail",
    "pv_persistence",
    "pv_worker",
]

# WeasyPrint ships no type information.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
