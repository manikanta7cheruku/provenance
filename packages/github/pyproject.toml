[project]
name = "pv-github"
version = "0.1.0"
description = "Provenance GitHub gateway: the one place that talks to GitHub."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pv-config", "pv-domain"]

[tool.uv.sources]
pv-config = { workspace = true }
pv-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_github"]
