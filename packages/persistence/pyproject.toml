[project]
name = "pv-persistence"
version = "0.1.0"
description = "Database engine, migrations and readiness checks."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pv-config",
]

[tool.uv.sources]
pv-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_persistence"]
