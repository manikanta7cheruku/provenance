[project]
name = "pv-llm"
version = "0.1.0"
description = "Provenance provider-independent LLM interface with a Gemini REST implementation."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pv-config",
    "pv-domain",
    "pv-persistence",
]

[tool.uv.sources]
pv-config = { workspace = true }
pv-domain = { workspace = true }
pv-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_llm"]
