[project]
name = "pv-files"
version = "0.1.0"
description = "Provenance private file storage and untrusted document text extraction."
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<1",
    "pypdf>=5,<7",
    "pv-config",
    "pv-domain",
]

[tool.uv.sources]
pv-config = { workspace = true }
pv-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_files"]
