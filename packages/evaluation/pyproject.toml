[project]
name = "pv-eval"
version = "0.1.0"
description = "Provenance evaluation harness: a labeled dataset, deterministic suites, an LLM suite and a regression gate."
requires-python = ">=3.12"
dependencies = [
    "pv-config",
    "pv-domain",
    "pv-llm",
    "pv-persistence",
]

[tool.uv.sources]
pv-config = { workspace = true }
pv-domain = { workspace = true }
pv-llm = { workspace = true }
pv-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_eval"]
