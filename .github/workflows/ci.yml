name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance -d provenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://provenance_app:ci_app_pw@localhost:5432/provenance
      MIGRATION_DATABASE_URL: postgresql+psycopg://provenance:ci_owner_pw@localhost:5432/provenance
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-0000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Native libraries for the resume PDF engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --all-packages --frozen
      - name: Dependency audit (known vulnerabilities in what ships)
        run: |
          uv export --no-dev --all-packages --frozen --no-hashes --no-emit-workspace > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

      - name: Create application role
        run: |
          PGPASSWORD=ci_owner_pw psql -h localhost -U provenance -d provenance -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE provenance_app LOGIN PASSWORD 'ci_app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"

      - name: Verify application database credentials
        run: |
          PGPASSWORD=ci_app_pw psql -h localhost -U provenance_app -d provenance -v ON_ERROR_STOP=1 \
            -c "SELECT current_user, current_database()"

      - name: Apply migrations
        run: uv run alembic -c packages/persistence/alembic.ini upgrade head

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Evaluation gate (the numbers, in the log)
        run: uv run python -m pv_eval run

      - name: Integration tests
        run: uv run pytest -m integration



  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit (known vulnerabilities in what ships)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:boundaries
      - run: npm run check:states
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm run check:copy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks (axe, keyboard, themes)
        run: npm run test:e2e

  images:
    # The production images must keep building, and the production stack must keep being valid.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Production stack is valid
        run: |
          IMAGE_TAG=ci POSTGRES_PASSWORD=x APP_DB_PASSWORD=x SECRET_KEY=x TOKEN_ENCRYPTION_KEYS=x           SMTP_HOST=x MAIL_FROM=x PUBLIC_BASE_URL=https://x SITE_ADDRESS=x           docker compose -f compose.prod.yaml config -q
      - name: Scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Build the API image
        run: docker build -f infra/docker/api.prod.Dockerfile -t provenance-api:ci .
      - name: The API image runs as a normal user and holds no development tools
        run: |
          test "$(docker run --rm provenance-api:ci id -u)" = "10001"
          ! docker run --rm provenance-api:ci sh -c 'command -v uv || command -v pytest || command -v ruff'
      - name: Build the web image
        run: docker build -f infra/docker/web.prod.Dockerfile -t provenance-web:ci .

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
