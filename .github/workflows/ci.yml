name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance -d provenance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://provenance_app:ci_app_pw@localhost:5432/provenance
      MIGRATION_DATABASE_URL: postgresql+psycopg://provenance:ci_owner_pw@localhost:5432/provenance
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-0000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: Unit tests
        run: uv run pytest
      - name: Create application role
        run: |
          PGPASSWORD=ci_owner_pw psql -h localhost -U provenance -d provenance -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE provenance_app LOGIN PASSWORD 'ci_app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
      - name: Apply migrations
        run: uv run alembic -c packages/persistence/alembic.ini upgrade head
      - name: Integration tests
        run: uv run pytest -m integration

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
